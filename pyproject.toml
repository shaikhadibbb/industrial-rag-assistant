[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-rag-assistant"
version = "0.1.0"
description = "Production-grade RAG for industrial maintenance manuals"
authors = [
    { name = "Shaikh Adib", email = "shaikhadibbb@example.com" }
]
dependencies = [
    "llama-index==0.10.57",
    "llama-index-retrievers-bm25==0.1.5",
    "qdrant-client==1.18.0",
    "fastapi==0.136.3",
    "gradio==6.15.1",
    "ragas==0.4.3",
    "mlflow==3.12.0",
    "sentence-transformers==5.5.1"
]

[tool.setuptools.packages.find]
where = ["src"]
