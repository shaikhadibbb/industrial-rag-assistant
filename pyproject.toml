[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-rag-assistant"
version = "0.1.0"
description = "Production-grade RAG for industrial maintenance manuals"
authors = [
    { name = "Shaikh Adib", email = "shaikhadibbb@example.com" }
]
dependencies = [
    "llama-index",
    "qdrant-client",
    "fastapi",
    "gradio",
    "ragas",
    "mlflow",
    "sentence-transformers"
]

[tool.setuptools.packages.find]
where = ["src"]
