[mypy]
python_version = 3.11
strict = True
warn_unused_ignores = False
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
ignore_missing_imports = True
exclude = (src/app\.py|src/ui\.py|src/retrieval/query_engine\.py|src/retrieval/vector_store\.py|src/retrieval/keyword_retriever\.py|src/retrieval/hybrid_retriever\.py|src/generation/llm_client\.py|src/evaluation/evaluator\.py|src/evaluation/ragas_eval\.py|src/retrieval/cross_encoder_reranker\.py)

[mypy-src.ingestion.pdf_parser]
warn_unused_ignores = False

[mypy-src.retrieval.embedder]
warn_unused_ignores = False

