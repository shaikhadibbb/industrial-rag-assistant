name: CI

on:
  push:
    branches: [main, production-rescue]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lint tools only
        run: pip install "ruff>=0.4" "black>=24.0"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Format check with black
        run: black --check src/ tests/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CI dependencies (lean set)
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -x
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          OLLAMA_BASE_URL: http://localhost:11434
          API_KEY: ci-test-key
          PYTHONPATH: .
