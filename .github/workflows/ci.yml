name: CI

on:
  push:
    branches: [main, production-rescue]
  pull_request:
    branches: [main]

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lint tools only
        run: pip install "ruff>=0.4" "black>=24.0"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Format check with black
        run: black --check src/ tests/

  type-check:
    name: Type Safety Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Strict mypy type check
        run: mypy src/

  test-coverage:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests with 60% coverage gate
        run: pytest --cov=src --cov-report=xml --cov-fail-under=60 tests/unit/ tests/property/ -v
        env:
          PYTHONPATH: .

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install scanning tools
        run: pip install bandit pip-audit

      - name: Scan code with bandit
        run: bandit -r src/ -ll

      - name: Scan dependencies with pip-audit
        run: pip-audit --desc || true

  deploy-smoke:
    name: Deployment Smoke Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - name: Wait for Render staging deploy
        run: sleep 45

      - name: Query health endpoint
        run: curl -f https://industrial-rag-assistant.onrender.com/health || exit 1
